<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESCRIBA HUB - Extrator de Texto (OCR)</title>
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Tesseract.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<div class="container">
    <header>
        <h1>🔍 Extrator de Texto (OCR)</h1>
        <p>Extraia texto legível de imagens (JPG, PNG) diretamente no seu navegador</p>
        <span class="badge-privacy">🔒 Processamento 100% Local</span>
    </header>

    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <p id="drop-text">Clique aqui ou arraste uma imagem (PNG, JPG)</p>
        <input type="file" id="file-input" accept="image/*">
        <img id="preview" class="preview-img" alt="Preview da Imagem">
    </div>

    <div class="controls">
        <button id="process-btn" class="btn" disabled>Extrair Texto</button>
        <button id="copy-btn" class="btn btn-secondary" disabled>Copiar Texto</button>
    </div>

    <div class="progress-bar-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="status-text" id="status-text"></div>

    <textarea id="result-text" placeholder="O texto reconhecido aparecerá aqui..." readonly></textarea>
</div>

<!-- Lógica JS -->
<script src="script.js"></script>
</body>
</html>
